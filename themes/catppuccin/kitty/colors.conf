# ---------------------------------------------------------
# Custom Catppuccin-based Palette
# ---------------------------------------------------------

# Basic Colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #45475a

# Cursor
cursor                  #cba6f7
cursor_text_color       #1e1e2e

# URL underline color when hovering with mouse
url_color               #89b4fa

# Window borders
active_border_color     #cba6f7
inactive_border_color   #313244
bell_border_color       #fab387

# Tab bar
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244
tab_bar_background      #11111b

# ---------------------------------------------------------
# The 16 Terminal Colors
# ---------------------------------------------------------

# Black (mapped to surface / bright surface)
color0  #313244
color8  #45475a

# Red (mapped to critical)
color1  #f38ba8
color9  #f38ba8

# Green (mapped to success)
color2  #a6e3a1
color10 #a6e3a1

# Yellow (mapped to warning)
color3  #fab387
color11 #fab387

# Blue (mapped to accent_alt)
color4  #89b4fa
color12 #89b4fa

# Magenta (mapped to accent)
color5  #cba6f7
color13 #cba6f7

# Cyan (mapped to accent_alt as a fallback)
color6  #89b4fa
color14 #89b4fa

# White (mapped to fg)
color7  #cdd6f4
color15 #cdd6f4
