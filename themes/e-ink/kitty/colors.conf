# ---------------------------------------------------------
# Custom E-Ink / Monochrome Palette
# ---------------------------------------------------------

# Basic Colors
foreground              #111111
background              #ffffff
selection_foreground    #111111
selection_background    #cccccc

# Cursor
cursor                  #000000
cursor_text_color       #ffffff

# URL underline color when hovering with mouse
url_color               #424242

# Window borders
active_border_color     #000000
inactive_border_color   #e0e0e0
bell_border_color       #616161

# Tab bar
active_tab_foreground   #ffffff
active_tab_background   #000000
inactive_tab_foreground #757575
inactive_tab_background #e0e0e0
tab_bar_background      #f5f5f5

# ---------------------------------------------------------
# The 16 Terminal Colors
# ---------------------------------------------------------

# Black (mapped to fg / accent_alt)
color0  #111111
color8  #424242

# Red (mapped to critical)
color1  #000000
color9  #000000

# Green (mapped to success)
color2  #222222
color10 #222222

# Yellow (mapped to warning)
color3  #616161
color11 #616161

# Blue (mapped to accent_alt)
color4  #424242
color12 #424242

# Magenta (mapped to accent)
color5  #000000
color13 #000000

# Cyan (mapped to muted to separate it from blue)
color6  #757575
color14 #757575

# White (mapped to surface_bright / bg_dark)
color7  #cccccc
color15 #f5f5f5