# ---------------------------------------------------------
# Custom Nord (Dark) Palette
# ---------------------------------------------------------

# Basic Colors
foreground              #d8dee9
background              #2e3440
selection_foreground    #d8dee9
selection_background    #434c5e

# Cursor
cursor                  #88c0d0
cursor_text_color       #2e3440

# URL underline color when hovering with mouse
url_color               #81a1c1

# Window borders
active_border_color     #88c0d0
inactive_border_color   #3b4252
bell_border_color       #ebcb8b

# Tab bar
active_tab_foreground   #242933
active_tab_background   #88c0d0
inactive_tab_foreground #d8dee9
inactive_tab_background #3b4252
tab_bar_background      #242933

# ---------------------------------------------------------
# The 16 Terminal Colors
# ---------------------------------------------------------

# Black (mapped to surface)
color0  #3b4252
# Bright Black (mapped to muted to serve as "bright black" / comments)
color8  #4c566a

# Red (mapped to critical)
color1  #bf616a
color9  #bf616a

# Green (mapped to success)
color2  #a3be8c
color10 #a3be8c

# Yellow (mapped to warning)
color3  #ebcb8b
color11 #ebcb8b

# Blue (mapped to accent_alt)
color4  #81a1c1
color12 #81a1c1

# Magenta (mapped to accent_alt as a fallback, keeping it cool-toned)
color5  #81a1c1
color13 #81a1c1

# Cyan (mapped to accent - Nord's signature frost color)
color6  #88c0d0
color14 #88c0d0

# White (mapped to fg)
color7  #d8dee9
color15 #d8dee9