include ~/.config/kitty/colors.conf

# --- Font ---
font_family      JetBrainsMono Nerd Font Mono
bold_italic_font auto
font_size        12.0

# --- Window ---
window_padding_width    14
window_border_width     1.0
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    yes

# --- Layouts & Navigation ---
enabled_layouts         tall, splits, grid, stack

# Neues Fenster / neuer Tab im aktuellen Arbeitsverzeichnis öffnen
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+t        new_tab_with_cwd

# Navigation zwischen Fenstern
map ctrl+left           neighboring_window left
map ctrl+right          neighboring_window right
map ctrl+up             neighboring_window up
map ctrl+down           neighboring_window down

# Tabs wechseln
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab

# --- Clipboard & Remote ---
map ctrl+insert         copy_to_clipboard
map shift+insert        paste_from_clipboard
copy_on_select          yes
strip_trailing_spaces   smart
allow_remote_control    yes

# --- Shell Integration & Hints (Completions) ---
# no-cursor lässt deine Cursor-Form unverändert, aktiviert aber Prompt-Tracking
shell_integration       enabled no-cursor

# Zu vorherigen/nächsten Befehlen springen
map ctrl+shift+z        scroll_to_prompt -1
map ctrl+shift+x        scroll_to_prompt 1

# Kitty Hints: Interaktive Textauswahl direkt im Terminal (wie Vimium im Browser)
map ctrl+shift+p>f      open_url_with_hints
map ctrl+shift+p>p      kitten hints --type path --program -
map ctrl+shift+p>l      kitten hints --type line --program -
map ctrl+shift+p>w      kitten hints --type word --program -
map ctrl+shift+p>h      kitten hints --type hash --program -

# Scrollback-Buffer im Pager oder Editor ansehen
scrollback_lines        10000
map ctrl+shift+h        show_scrollback

# --- URLs & Links ---
detect_urls             yes
open_url_with           default
url_style               curly

# --- Aesthetics & Performance ---
cursor_shape            block
cursor_blink_interval   0
enable_audio_bell       no

# Weichere Bewegung / visuelle Ruhe
repaint_delay           8
input_delay             2
sync_to_monitor         yes
mouse_hide_wait         1.5

# --- Tab Bar Styling ---
tab_bar_edge            bottom
tab_bar_style          powerline
tab_powerline_style     slanted
tab_separator          "  │  "
tab_bar_margin_width    2
tab_bar_margin_height   0 0
tab_activity_symbol     "●"
tab_title_template      {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}